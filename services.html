<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Services – Real Estate Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="nav-slot"></div>
    <header class="page-hero">
        <div class="container position-relative" style="z-index:2"><span class="tag">What we do</span>
            <h1 class="display-4 mt-2">Our Services</h1>
            <p class="text-secondary mb-0">End-to-end support for every property need.</p>
        </div>
    </header>
    <section>
        <div class="container">
            <div class="row g-4" id="service-grid"></div>
        </div>
    </section>
    <section class="alt">
        <div class="container">
            <div class="text-center mb-5"><span class="tag">Process</span>
                <h2 class="title display-6 mt-2">How it works</h2>
            </div>
            <div class="row g-4 text-center">
                <div class="col-md-4 reveal">
                    <div class="panel">
                        <div class="icon-box mx-auto"><i class="bi bi-search"></i></div>
                        <h5>1. Search</h5>
                        <p class="text-secondary small mb-0">Tell us what you need and browse matches.</p>
                    </div>
                </div>
                <div class="col-md-4 reveal">
                    <div class="panel">
                        <div class="icon-box mx-auto"><i class="bi bi-calendar-check"></i></div>
                        <h5>2. Visit</h5>
                        <p class="text-secondary small mb-0">Book viewings with a verified agent.</p>
                    </div>
                </div>
                <div class="col-md-4 reveal">
                    <div class="panel">
                        <div class="icon-box mx-auto"><i class="bi bi-file-earmark-check"></i></div>
                        <h5>3. Close</h5>
                        <p class="text-secondary small mb-0">We handle paperwork until you get the keys.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div id="footer-slot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
