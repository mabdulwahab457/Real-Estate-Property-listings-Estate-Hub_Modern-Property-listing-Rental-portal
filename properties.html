<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Properties – Real Estate Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="nav-slot"></div>
    <header class="page-hero">
        <div class="container position-relative" style="z-index:2"><span class="tag">Listings</span>
            <h1 class="display-4 mt-2">Browse Properties</h1>
            <p class="text-secondary mb-0">Filter by type, search by area or name.</p>
        </div>
    </header>
    <section>
        <div class="container">
            <div class="row g-3 mb-5 align-items-center">
                <div class="col-lg-5 d-flex gap-2 flex-wrap"><button class="filter-btn active"
                        data-f="all">All</button><button class="filter-btn" data-f="sale">For Sale</button><button
                        class="filter-btn" data-f="rent">For Rent</button></div>
                <div class="col-lg-4"><input id="q" class="form-control" placeholder="Search name or area..."></div>
                <div class="col-lg-3"><select id="type" class="form-select">
                        <option value="all">All Types</option>
                        <option>House</option>
                        <option>Apartment</option>
                        <option>Plot</option>
                        <option>Commercial</option>
                    </select></div>
            </div>
            <div class="row g-4" id="prop-grid"></div>
        </div>
    </section>
    <div id="footer-slot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
